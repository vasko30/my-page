<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAL Stock Price Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
            width: 320px;
        }
        h1 { margin-top: 0; color: #58a6ff; font-size: 24px; }
        .ticker { font-size: 14px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .price { font-size: 38px; font-weight: bold; color: #e6edf3; margin: 15px 0; }
        .update-time { font-size: 12px; color: #8b949e; }
        .loading { color: #d29922; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <div class="ticker">American Airlines (AAL)</div>
        <h1>Цена акции</h1>
        <div id="price" class="price loading">Загрузка...</div>
        <div class="update-time" id="time">Обновление каждые 60 сек</div>
    </div>

    <script>
        async function fetchStockPrice() {
            const priceElement = document.getElementById('price');
            const timeElement = document.getElementById('time');
            
            // Используем публичный API Yahoo Finance через CORS-прокси allorigins
            const yahooURL = 'https://query1.finance.yahoo.com/v8/finance/chart/AAL?interval=1m';
            const proxyURL = `https://api.allorigins.win/get?url=${encodeURIComponent(yahooURL)}`;

            try {
                const response = await fetch(proxyURL);
                if (!response.ok) throw new Error('Ошибка сети');
                
                const data = await response.json();
                const contents = JSON.parse(data.contents);
                
                // Достаем актуальную цену из ответа Yahoo Chart API
                const meta = contents.chart.result[0].meta;
                const currentPrice = meta.regularMarketPrice || meta.chartPreviousClose;
                const currency = meta.currency || 'USD';

                priceElement.classList.remove('loading');
                priceElement.innerText = `${currentPrice.toFixed(2)} ${currency}`;
                
                const now = new Date();
                timeElement.innerText = `Обновлено: ${now.toLocaleTimeString()}`;
            } catch (error) {
                console.error('Ошибка при получении данных:', error);
                priceElement.innerText = 'Ошибка API';
                timeElement.innerText = 'Повтор через 60 сек...';
            }
        }

        // Первичный запуск при открытии страницы
        fetchStockPrice();

        // Автообновление каждые 60 секунд (60000 миллисекунд)
        setInterval(fetchStockPrice, 60000);
    </script>
</body>
</html>
