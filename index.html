<script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynsJ2EGFpJBa9DAouEoP4s8vovb4ref_HzSZQ9qahEmfxhbnnSEg9Kt2CPvVL2ENIL/exec';

        const tickersList = [
            'AAL', 'TSCO', 'LCID', 'AAPL', 'MSFT', 'NVDA', 'AMZN', 
            'GOOGL', 'META', 'TSLA', 'AMD', 'NFLX', 'INTC', 'PYPL', 
            'EURUSD=X', 'USDJPY=X'
        ];

        let timerId = null;

        function initGrid() {
            const grid = document.getElementById('portfolio-grid');
            grid.innerHTML = '';
            tickersList.forEach(t => {
                grid.innerHTML += `
                    <div class="card" id="card-${t}">
                        <div class="ticker">${t}</div>
                        <div class="price" id="price-${t}">--</div>
                        <div class="change" id="change-${t}">0.00%</div>
                    </div>
                `;
            });
        }

        // Проверка: открыта ли биржа (Пн-Пт, с 9:30 до 16:00 по EST/EDT)
        function isMarketOpen() {
            // Получаем текущее время именно в американской таймзоне Нью-Йорка
            const now = new Date();
            const nyTimeStr = now.toLocaleString("en-US", { timeZone: "America/New_York" });
            const nyDate = new Date(nyTimeStr);
            
            const day = nyDate.getDay(); // 0 - ВС, 6 - СБ
            if (day === 0 || day === 6) return false;

            const hours = nyDate.getHours();
            const minutes = nyDate.getMinutes();
            const timeInMinutes = hours * 60 + minutes;

            const marketOpenMinutes = 9 * 60 + 30;  // 9:30
            const marketCloseMinutes = 16 * 60;     // 16:00

            return timeInMinutes >= marketOpenMinutes && timeInMinutes <= marketCloseMinutes;
        }

        async function updatePrices() {
            const statusEl = document.getElementById('status');

            if (!isMarketOpen()) {
                statusEl.innerText = 'Биржа закрыта. Торги завершены / выходной день.';
                return; // Пропускаем обновление вне сессии
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?tickers=${tickersList.join(',')}`);
                const result = await response.json();

                if (result.error) throw new Error(result.error);

                result.data.forEach(item => {
                    const priceEl = document.getElementById(`price-${item.ticker}`);
                    const changeEl = document.getElementById(`change-${item.ticker}`);

                    if (priceEl && changeEl) {
                        priceEl.innerText = `${item.price.toFixed(2)} ${item.currency}`;
                        const changeVal = item.change.toFixed(2);
                        changeEl.innerText = `${changeVal > 0 ? '+' : ''}${changeVal}%`;
                        changeEl.className = `change ${changeVal >= 0 ? 'up' : 'down'}`;
                    }
                });

                statusEl.innerText = `Биржа открыта • Обновлено: ${result.time} (следующее через 60 сек)`;
            } catch (e) {
                console.error('Ошибка обновления:', e);
                statusEl.innerText = 'Ошибка загрузки котировок';
            }
        }

        initGrid();
        updatePrices();
        
        // Проверяем и обновляем каждую минуту
        setInterval(updatePrices, 60000);
    </script>
