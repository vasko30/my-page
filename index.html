<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trading Journal</title>
  <style>
    /* Базовые стили и темная тема */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      -webkit-font-smoothing: antialiased;
    }

    /* Контейнер таблицы */
    .table-container {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 320px;
    }

    th, td {
      padding: 12px 8px;
      text-align: right;
      border-bottom: 1px solid #21262d;
    }

    th:first-child, td:first-child {
      text-align: left;
      padding-left: 15px;
    }
    
    th:last-child, td:last-child {
      padding-right: 15px;
    }

    th {
      color: #8b949e;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Цвета для PnL */
    .profit { color: #3fb950; }
    .loss { color: #f85149; }
    .neutral { color: #8b949e; }

    .ticker-name {
      font-weight: 600;
      color: #c9d1d9;
    }

    /* --- НОВАЯ НИЖНЯЯ ПАНЕЛЬ (В потоке страницы) --- */
    .bottom-panel {
      position: relative;
      width: 100%;
      padding: 20px 15px 40px 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background-color: #0d1117;
      border-top: 1px solid #21262d;
    }

    /* 1. Строка с вводом тикера */
    .add-ticker-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .add-ticker-row input {
      flex: 1;
      padding: 12px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    
    .add-ticker-row input:focus {
      border-color: #58a6ff;
    }

    .add-ticker-row button {
      background-color: #238636;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .add-ticker-row button:active {
      background-color: #2ea043;
    }

    /* 2. Кнопки экспорта / импорта */
    .transfer-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }

    .btn-transfer {
      flex: 1;
      padding: 10px 12px;
      background-color: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-transfer:active {
      background-color: #30363d;
    }

    /* 3. Переключатель вида */
    .view-switch-row a {
      color: #58a6ff;
      font-size: 14px;
      text-decoration: none;
      padding: 8px;
    }
    
    .view-switch-row a:hover {
      text-decoration: underline;
    }

    /* Альтернативный вид (Десктоп/Компактный) */
    body.desktop-view table {
      font-size: 16px;
    }
    body.desktop-view th, body.desktop-view td {
      padding: 16px 12px;
    }
  </style>
</head>
<body>

  <!-- Таблица позиций -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Ticker</th>
          <th>Qty</th>
          <th>Avg</th>
          <th>Price</th>
          <th>PnL $</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Строки генерируются через JS -->
      </tbody>
    </table>
  </div>

  <!-- Обновленная нижняя панель -->
  <div class="bottom-panel">
    
    <!-- 1. Добавление позиции -->
    <div class="add-ticker-row">
      <input type="text" id="tickerInput" placeholder="Тикер (напр. TSLA)" autocomplete="off">
      <button id="addBtn" onclick="addPosition()">Добавить</button>
    </div>

    <!-- 2. Выгрузка / Загрузка (Экспорт/Импорт) -->
    <div class="transfer-row">
      <button class="btn-transfer" onclick="exportState()">Выгрузить JSON</button>
      <button class="btn-transfer" onclick="document.getElementById('importFile').click()">Загрузить JSON</button>
      <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importState(event)">
    </div>

    <!-- 3. Переключение вида -->
    <div class="view-switch-row">
      <a href="#" onclick="toggleView(event)">Переключить вид (Моб/Десктоп)</a>
    </div>

  </div>

  <script>
    // Ключ для сохранения данных в памяти браузера
    const STORAGE_KEY = 'portfolio_positions_v1';

    // Дефолтные данные для первого запуска
    const defaultPositions = [
      { ticker: 'AAL', qty: -3, avg: 13.27, price: 14.93 },
      { ticker: 'COTY', qty: -4, avg: 2.57, price: 2.76 },
      { ticker: 'SOFI', qty: 10, avg: 7.10, price: 7.45 }
    ];

    // Загрузка состояния из localStorage
    let positions = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!positions || positions.length === 0) {
      positions = defaultPositions;
      saveState();
    }

    // Сохранение в localStorage
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
    }

    // Расчет PnL (учитывает шорт и лонг на базе США, без встречного хеджирования)
    function calculatePnL(pos) {
      if (pos.qty === 0) return 0;
      // Если qty < 0 (шорт), прибыль когда текущая цена ниже средней
      // Если qty > 0 (лонг), прибыль когда текущая цена выше средней
      return (pos.price - pos.avg) * pos.qty;
    }

    // Форматирование чисел
    function formatNumber(num) {
      return num.toFixed(2);
    }
    
    function formatPnL(num) {
      const formatted = num.toFixed(2);
      return num > 0 ? `+${formatted}` : formatted;
    }

    function getPnLClass(num) {
      if (num > 0) return 'profit';
      if (num < 0) return 'loss';
      return 'neutral';
    }

    // Отрисовка таблицы
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      positions.forEach((pos, index) => {
        const pnl = calculatePnL(pos);
        const pnlClass = getPnLClass(pnl);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="ticker-name">${pos.ticker}</td>
          <td>${pos.qty}</td>
          <td>${formatNumber(pos.avg)}</td>
          <td>${formatNumber(pos.price)}</td>
          <td class="${pnlClass}">${formatPnL(pnl)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Добавление новой позиции (заготовка)
    function addPosition() {
      const input = document.getElementById('tickerInput');
      const ticker = input.value.trim().toUpperCase();
      
      if (!ticker) return;

      // Проверка, есть ли уже тикер
      const exists = positions.find(p => p.ticker === ticker);
      if (exists) {
        alert('Этот тикер уже есть в списке.');
        return;
      }

      // Добавляем болванку, здесь можно прикрутить запрос к Google Apps Script для получения реальной цены
      positions.push({
        ticker: ticker,
        qty: 0,
        avg: 0.00,
        price: 0.00
      });

      saveState();
      renderTable();
      input.value = '';
      
      // Вызов функции обновления через GAS (раскомментировать и настроить под себя)
      // updatePricesFromGAS();
    }

    // --- ЛОГИКА ЭКСПОРТА И ИМПОРТА ---

    function exportState() {
      const data = JSON.stringify(positions, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const a = document.createElement('a');
      a.href = url;
      a.download = `portfolio_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importState(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsedData = JSON.parse(e.target.result);
          if (Array.isArray(parsedData)) {
            positions = parsedData;
            saveState();
            renderTable();
            alert('Данные успешно загружены!');
          } else {
            alert('Неверный формат данных в файле.');
          }
        } catch (err) {
          alert('Ошибка чтения файла. Убедитесь, что это корректный JSON.');
        }
      };
      
      reader.readAsText(file);
      event.target.value = ''; // Сброс инпута
    }

    // --- ПЕРЕКЛЮЧЕНИЕ ВИДА ---

    function toggleView(event) {
      event.preventDefault();
      document.body.classList.toggle('desktop-view');
      // Опционально: можно сохранять выбранный вид в localStorage
      const isDesktop = document.body.classList.contains('desktop-view');
      localStorage.setItem('view_preference', isDesktop ? 'desktop' : 'mobile');
    }

    // Восстановление вида при загрузке
    if (localStorage.getItem('view_preference') === 'desktop') {
      document.body.classList.add('desktop-view');
    }

    // Первичная отрисовка при загрузке страницы
    renderTable();

  </script>
</body>
</html>
